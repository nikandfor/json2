version: 2
jobs:
  go1.27: &base
    docker:
      - image: cimg/go:1.27
    steps:
      - run: go version
      - checkout
      - run: go test -race -v ./...

  go1.26:
    <<: *base
    docker:
      - image: cimg/go:1.26

  go1.25:
    <<: *base
    docker:
      - image: cimg/go:1.25

  go1.24:
    <<: *base
    docker:
      - image: cimg/go:1.24

workflows:
  version: 2
  build:
    jobs:
      - go1.27
      - go1.26
      - go1.25
      - go1.24
